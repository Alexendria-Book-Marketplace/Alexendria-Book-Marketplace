<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search results - Alexandria</title>

  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="ProductFuture.css">
  <link rel="stylesheet" href="marketplace.css">
  <script src="shared.js" defer></script>
</head>
<body>

  <header class="site-header" id="site-header">
    <nav aria-label="Main">
      <a class="brand" href="index.html">
        <span class="logo-circle"><img src="bibliotheque.png" alt="" width="28" height="28"></span>
        Alexandria
      </a>

      <form class="search-form" id="search-form" action="search.html" method="get" role="search">
        <input type="search" id="search" name="q" placeholder="Search titles, authors, ISBN (press / to focus)" aria-label="Search titles, authors or ISBN">

        <select id="genre" name="genre" aria-label="Genre">
          <option>All genres</option>
          <option>Fiction</option>
          <option>Mystery</option>
          <option>Science fiction</option>
          <option>History</option>
          <option>Biography</option>
          <option>Children</option>
        </select>

        <select id="location" name="location" aria-label="Location">
          <option>Ottawa</option>
          <option>Gatineau</option>
          <option>Kanata</option>
          <option>Orléans</option>
        </select>
      </form>

      <a class="account" href="account.html">
        <img src="profile.jpg" alt="" width="24" height="24">
        Account
      </a>
    </nav>
  </header>

  <section class="page-title">
    <div class="page-title-text">
      <h1>Search results</h1>
      <p>Find used books by title, author or genre.</p>
    </div>
  </section>

  <main class="listings">
    <div class="search-toolbar">
      <div class="search-status">
        <p class="search-summary" id="search-summary" role="status" aria-live="polite"></p>
        <a class="search-clear" id="search-clear" href="search.html" hidden>Clear search</a>
      </div>
      <label class="search-area" id="area-toggle" hidden>
        <input type="checkbox" id="only-area">
        Only show pickup in <span id="area-name"></span>
      </label>
    </div>

    <div class="listing-list" id="listing-list"></div>

    <div class="search-empty" id="search-empty" hidden>
      <p><strong>No listings match your search.</strong> Try fewer words, check the spelling, or set the genre to &ldquo;All genres&rdquo;.</p>
      <a class="btn" href="marketplace.html">Browse all listings</a>
    </div>
    <noscript><p class="listings__note">Search results need JavaScript to show up.</p></noscript>
  </main>

  <footer>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="ProductFeature.html">Features</a>
      <a href="pricing.html">Pricing</a>
      <a href="team.html">Team</a>
      <a href="return.html">Return Policy</a>
      <a href="terms.html">Terms &amp; Conditions</a>
    </div>
    <p>&copy; 2026 Alexandria</p>
  </footer>
  <script src="ProductFuture.js"></script>
  <script src="listings.js"></script>
  <script src="search.js"></script>
</body>
</html>
